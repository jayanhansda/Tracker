<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile App Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>QuestBoard: Personal Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --bg-panel: #141418;
            --text-main: #e0e0e0;
            --text-muted: #808080;
            --accent-purple: #7b2cbf;
            --accent-purple-glow: rgba(123, 44, 191, 0.3);
            --accent-green: #00b4d8; 
            --accent-red: #d00000;
            --border-color: #2a2a35;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Mobile-first padding adjustments */
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 10px; display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent; }
        
        .container { width: 100%; max-width: 1000px; display: grid; gap: 15px; grid-template-columns: 1fr; }
        @media(min-width: 768px) { 
            body { padding: 20px; }
            .container { grid-template-columns: 1fr 1fr; gap: 20px; } 
        }
        
        .panel { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        h2, h3 { color: var(--text-main); font-weight: 500; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Master Ring */
        .master-ring-container { display: flex; justify-content: center; align-items: center; flex-direction: column; grid-column: 1 / -1; }
        .progress-circle { position: relative; width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(var(--accent-purple) 0%, var(--bg-dark) 0%); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px var(--accent-purple-glow); margin: 10px 0; }
        .progress-circle::after { content: ''; position: absolute; width: 110px; height: 110px; background: var(--bg-panel); border-radius: 50%; }
        .progress-value { position: relative; z-index: 1; font-size: 1.8rem; font-weight: bold; color: var(--text-main); }
        
        /* Context & Setup */
        .context-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; grid-column: 1 / -1; flex-wrap: wrap; }
        .btn { background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; font-weight: 500; }
        .btn.active, .btn:active { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }
        .btn-danger { background: var(--bg-dark); border: 1px solid var(--accent-red); color: var(--accent-red); }
        
        /* List Items */
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; background: var(--bg-dark); border-radius: 6px; margin-bottom: 8px; font-size: 0.95rem; }
        .list-item input[type="checkbox"] { accent-color: var(--accent-purple); width: 22px; height: 22px; margin-left: 10px; }
        
        /* Inputs: font-size 16px is required to stop iOS from auto-zooming */
        input[type="text"], input[type="number"] { background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; width: 100%; outline: none; font-size: 16px; }
        input:focus { border-color: var(--accent-purple); }
        
        /* Chart */
        .chart-container { position: relative; height: 280px; width: 100%; }

        /* Settings & Data Management */
        .data-management { display: flex; gap: 10px; margin-top: 10px; grid-column: 1 / -1; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Master Ring -->
        <div class="panel master-ring-container">
            <h2 style="margin-bottom: 5px;">Today's Progress</h2>
            <div class="progress-circle" id="masterRing" style="background: conic-gradient(var(--accent-purple) 0%, var(--bg-dark) 0%);">
                <div class="progress-value" id="masterValue">0%</div>
            </div>
        </div>

        <!-- Context & Setup -->
        <div class="context-bar">
            <button class="btn active">Work from Home</button>
            <button class="btn">Work from Office</button>
            <button class="btn">Weekend</button>
        </div>

        <!-- Radar Chart -->
        <div class="panel">
            <div class="panel-header"><h2>Attribute Matrix</h2></div>
            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

        <!-- Modules -->
        <div class="panel">
            <div class="panel-header"><h2>Good Habits</h2></div>
            <div id="habitsList">
                <div class="list-item"><span>Morning Stretch</span><input type="checkbox"></div>
                <div class="list-item"><span>Read 10 Pages</span><input type="checkbox"></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" placeholder="New habit...">
                <button class="btn" style="padding: 10px 15px;">+</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>Hydration</h2></div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-size: 0.95rem;">Target (Liters)</span>
                <input type="number" value="3" step="0.5" style="width: 70px; text-align: right; padding: 8px;">
            </div>
            <div style="margin-top: 10px;">
                <button class="btn" style="width: 100%; background: var(--accent-green); color: #fff; padding: 12px; font-weight: bold;">+ 0.5L Logged</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>Personal Growth</h2></div>
            <div class="list-item">
                <span>CFA Prep (Hrs)</span>
                <input type="number" value="0" style="width: 70px; padding: 8px; text-align: right;">
            </div>
            <div class="list-item">
                <span>SQL / Power BI (Hrs)</span>
                <input type="number" value="0" style="width: 70px; padding: 8px; text-align: right;">
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>Spending (₹)</h2></div>
            <div style="display: flex; gap: 8px; margin-bottom: 15px; align-items: stretch;">
                <input type="text" placeholder="Description" style="flex: 2;">
                <input type="number" placeholder="₹" style="flex: 1; padding: 8px;">
                <button class="btn" style="padding: 10px 15px;">+</button>
            </div>
            <div class="list-item" style="color: var(--text-muted); font-size: 0.85rem; justify-content: center;">
                Limit: ₹15,000 &nbsp;|&nbsp; Rem: <span style="color: var(--accent-green); margin-left: 5px; font-weight: bold;">₹15,000</span>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h2>Side Quests</h2></div>
            <div id="questList">
                <!-- Quests go here -->
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <input type="text" placeholder="Add task...">
                <button class="btn" style="padding: 10px 15px;">+</button>
            </div>
        </div>

        <!-- Manual Sync Data Management -->
        <div class="data-management">
            <button class="btn" onclick="exportData()">Export Data</button>
            <button class="btn" onclick="importData()">Import Data</button>
        </div>
    </div>

    <script>
        // Chart Initialization
        const ctx = document.getElementById('radarChart').getContext('2d');
        const radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Efficiency', 'Habits', 'Hydration', 'Growth', 'Spending', 'Quests'],
                datasets: [{
                    data: [0, 0, 0, 0, 0, 0],
                    backgroundColor: 'rgba(123, 44, 191, 0.25)',
                    borderColor: '#7b2cbf',
                    pointBackgroundColor: '#7b2cbf',
                    pointBorderColor: '#fff',
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255, 255, 255, 0.05)' },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        pointLabels: { color: '#e0e0e0', font: { size: 11, family: 'Segoe UI' } },
                        ticks: { display: false, min: 0, max: 100 }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        function exportData() {
            const data = JSON.stringify(localStorage);
            const blob = new Blob([data], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'QuestBoard_Backup.txt';
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'text/plain';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = event => {
                    const data = JSON.parse(event.target.result);
                    Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
                    alert('Data imported! Refreshing page...');
                    location.reload();
                };
                reader.readAsText(file);
            };
            input.click();
        }
    </script>
</body>
</html>
